# PostgreSQL do EntreTurnos para desenvolvimento local.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: entreturnos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: entreturnos
      POSTGRES_PASSWORD: entreturnos
      POSTGRES_DB: entreturnos
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - '5432:5432'
    volumes:
      - entreturnos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U entreturnos -d entreturnos']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  entreturnos_pgdata:
